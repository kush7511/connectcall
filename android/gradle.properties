org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Build a normal phone APK by default. Without this, Flutter asks Gradle
# for armv7, arm64, and x86_64 engine artifacts, which is much heavier and
# failed on this machine while C:\Users\kush kumar\.gradle was low on space.
target-platform=android-arm64
